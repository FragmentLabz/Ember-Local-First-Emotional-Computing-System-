<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:  #d9e1e4;
    --strip:  #edf1f2;
    --rule:   #b7c4c9;
    --ink:    #0e1f29;
    --soft:   #5a737e;
    --pen:    #b01236;
    --pen-2:  #1f6076;
    --grid:   rgba(14, 31, 41, .045);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 28px 20px 64px;
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(to right,  var(--grid) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 28px);
    color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    line-height: 1.5;
  }

  .sheet { max-width: 940px; margin: 0 auto; }

  /* ---- masthead ---------------------------------------------------------- */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--ink);
  }

  h1 {
    font-family: "Archivo Narrow", sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 7vw, 46px);
    letter-spacing: .10em;
    text-transform: uppercase;
    margin: 0;
    line-height: .95;
  }

  .repo {
    margin: 6px 0 0;
    color: var(--soft);
    font-size: 12px;
    letter-spacing: .04em;
    word-break: break-all;
  }

  .readouts {
    display: flex;
    gap: 26px;
    margin: 0;
    font-variant-numeric: tabular-nums;
  }

  .readouts div { text-align: right; }

  .readouts dt {
    font-family: "Archivo Narrow", sans-serif;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--soft);
    white-space: nowrap;
  }

  .readouts dd {
    margin: 1px 0 0;
    font-size: 26px;
    font-weight: 500;
    line-height: 1.1;
  }

  .readouts dd.muted { color: var(--soft); }

  /* ---- range control ----------------------------------------------------- */
  .ranges {
    display: flex;
    gap: 2px;
    margin: 16px 0 30px;
  }

  .ranges button {
    font: inherit;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--soft);
    background: transparent;
    border: 1px solid var(--rule);
    padding: 5px 12px;
    cursor: pointer;
  }

  .ranges button:hover { color: var(--ink); border-color: var(--soft); }

  .ranges button[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--strip);
  }

  :focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

  /* ---- strips ------------------------------------------------------------ */
  .strip { margin-bottom: 26px; }

  .strip-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 5px;
  }

  .strip-head h2 {
    font-family: "Archivo Narrow", sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin: 0;
  }

  .strip-head .sum {
    font-size: 11px;
    color: var(--soft);
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
  }

  .chart {
    background: var(--strip);
    border: 1px solid var(--rule);
    touch-action: pan-y;
  }

  .chart svg { display: block; width: 100%; }

  .empty {
    padding: 22px 16px;
    color: var(--soft);
    font-size: 12px;
    background: var(--strip);
    border: 1px solid var(--rule);
  }

  .empty b {
    display: block;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .pen { transition: transform .18s cubic-bezier(.2, .7, .3, 1); }
  .cursor-line { transition: transform .18s cubic-bezier(.2, .7, .3, 1); }

  @media (prefers-reduced-motion: reduce) {
    .pen, .cursor-line { transition: none; }
  }

  footer {
    margin-top: 34px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
    color: var(--soft);
    font-size: 11px;
    letter-spacing: .03em;
  }

  footer a { color: var(--pen-2); }

  @media (max-width: 560px) {
    .masthead { align-items: flex-start; }
    .readouts { gap: 18px; }
    .readouts dd { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="sheet">

  <header class="masthead">
    <div>
      <h1>Traffic log</h1>
      <p class="repo" id="repo">reading&hellip;</p>
    </div>
    <dl class="readouts" id="readouts">
      <div><dt id="lab-a">Views</dt><dd id="val-a">&mdash;</dd></div>
      <div><dt id="lab-b">Unique</dt><dd id="val-b">&mdash;</dd></div>
      <div><dt id="lab-c">Clones</dt><dd id="val-c">&mdash;</dd></div>
      <div><dt id="lab-d">Downloads</dt><dd id="val-d">&mdash;</dd></div>
    </dl>
  </header>

  <nav class="ranges" id="ranges" aria-label="Time range"></nav>

  <main id="strips"></main>

  <footer>
    Snapshotted daily at 23:50 UTC from the GitHub traffic and releases APIs.
    Raw data: <a href="views.csv">views.csv</a>,
    <a href="clones.csv">clones.csv</a>,
    <a href="downloads.csv">downloads.csv</a>.
  </footer>

</div>

<script>
(function () {
  "use strict";

  var H = 104, PAD_TOP = 14, PAD_BOTTOM = 20;
  var state = { days: [], range: 90, cursor: null, charts: [] };

  // ---- csv ---------------------------------------------------------------
  function parseCSV(text) {
    var rows = [], row = [], field = "", quoted = false, i;
    for (i = 0; i < text.length; i++) {
      var c = text[i];
      if (quoted) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
        else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c !== "\r") field += c;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    if (!rows.length) return [];
    var head = rows.shift();
    return rows.filter(function (r) { return r.length === head.length; })
               .map(function (r) {
                 var o = {};
                 head.forEach(function (h, j) { o[h] = r[j]; });
                 return o;
               });
  }

  function get(path) {
    return fetch(path, { cache: "no-store" }).then(function (r) {
      return r.ok ? r.text() : null;
    }).catch(function () { return null; });
  }

  // ---- dates -------------------------------------------------------------
  function addDays(iso, n) {
    var d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function series(fromISO, toISO) {
    var out = [], d = fromISO;
    while (d <= toISO) { out.push(d); d = addDays(d, 1); }
    return out;
  }

  function fmt(n) {
    if (n === null || n === undefined) return "\u2014";
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  function label(iso) {
    var d = new Date(iso + "T00:00:00Z");
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", timeZone: "UTC" });
  }

  // ---- build -------------------------------------------------------------
  Promise.all([
    get("views.csv"), get("clones.csv"), get("downloads.csv"), get("repo.txt")
  ]).then(function (res) {
    var views = res[0] ? parseCSV(res[0]) : [];
    var clones = res[1] ? parseCSV(res[1]) : [];
    var dls = res[2] ? parseCSV(res[2]) : [];

    document.getElementById("repo").textContent = res[3] ? res[3].trim() : "";

    if (!views.length && !clones.length) { noData(res[0] === null); return; }

    // Cumulative download snapshots -> downloads per day.
    var byDate = {};
    dls.forEach(function (r) {
      byDate[r.date] = (byDate[r.date] || 0) + (parseInt(r.download_count, 10) || 0);
    });
    var snapDates = Object.keys(byDate).sort(), daily = {}, prev = null;
    snapDates.forEach(function (d) {
      // First snapshot has nothing to compare against, so it isn't a day's worth.
      if (prev !== null) daily[d] = Math.max(0, byDate[d] - prev);
      prev = byDate[d];
    });

    var vMap = {}, cMap = {};
    views.forEach(function (r) { vMap[r.date] = r; });
    clones.forEach(function (r) { cMap[r.date] = r; });

    var all = Object.keys(vMap).concat(Object.keys(cMap)).concat(snapDates).sort();
    var today = new Date().toISOString().slice(0, 10);
    var last = all[all.length - 1];

    state.days = series(all[0], last > today ? last : today).map(function (d) {
      return {
        date: d,
        views: vMap[d] ? +vMap[d].count : 0,
        uniques: vMap[d] ? +vMap[d].uniques : 0,
        clones: cMap[d] ? +cMap[d].count : 0,
        downloads: daily[d] === undefined ? null : daily[d]
      };
    });

    state.hasDownloads = snapDates.length > 1;
    buildRanges();
    render();
    window.addEventListener("resize", debounce(render, 150));
  });

  function noData(missing) {
    document.getElementById("strips").innerHTML =
      '<div class="empty"><b>' +
      (missing ? "No data files found." : "No days recorded yet.") +
      '</b>The collector runs at 23:50 UTC and backfills the last 14 days on its ' +
      'first run. Trigger it now from the Actions tab to fill this in. If you opened ' +
      'this file directly from disk, serve the folder over http instead \u2014 ' +
      'browsers block local file reads.</div>';
  }

  function debounce(fn, ms) {
    var t; return function () { clearTimeout(t); t = setTimeout(fn, ms); };
  }

  // ---- range control ------------------------------------------------------
  function buildRanges() {
    var opts = [14, 30, 90, 365].filter(function (n) { return n < state.days.length; });
    opts.push(0); // all
    var nav = document.getElementById("ranges");
    nav.innerHTML = "";
    if (opts.length < 2) return;
    if (opts.indexOf(state.range) === -1) state.range = opts[0];
    opts.forEach(function (n) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = n === 0 ? "All" : n + "d";
      b.setAttribute("aria-pressed", n === state.range);
      b.onclick = function () {
        state.range = n;
        state.cursor = null;
        nav.querySelectorAll("button").forEach(function (x) {
          x.setAttribute("aria-pressed", x === b);
        });
        render();
      };
      nav.appendChild(b);
    });
  }

  function windowed() {
    return state.range ? state.days.slice(-state.range) : state.days;
  }

  // ---- render -------------------------------------------------------------
  function render() {
    var days = windowed();
    var host = document.getElementById("strips");
    host.innerHTML = "";
    state.charts = [];

    strip(host, days, "Page views", "views", "uniques");
    strip(host, days, "Clones", "clones", null);
    if (state.hasDownloads) {
      strip(host, days, "Release downloads", "downloads", null);
    } else {
      var d = document.createElement("div");
      d.className = "strip";
      d.innerHTML = '<div class="strip-head"><h2>Release downloads</h2></div>' +
        '<div class="empty">Needs two snapshots to show a daily figure, since GitHub ' +
        'only reports a running total. Nothing here yet.</div>';
      host.appendChild(d);
    }
    setCursor(null);
  }

  function strip(host, days, title, key, subKey) {
    var total = days.reduce(function (a, d) { return a + (d[key] || 0); }, 0);

    var wrap = document.createElement("section");
    wrap.className = "strip";
    wrap.innerHTML = '<div class="strip-head"><h2>' + title + '</h2>' +
      '<span class="sum">' + fmt(total) + ' over ' + days.length + ' days</span></div>' +
      '<div class="chart"></div>';
    host.appendChild(wrap);

    var box = wrap.querySelector(".chart");
    var W = box.clientWidth || 900;
    var colW = W / days.length;
    var base = H - PAD_BOTTOM;
    var max = Math.max(1, Math.max.apply(null, days.map(function (d) { return d[key] || 0; })));
    var scale = (base - PAD_TOP) / max;
    var barW = Math.max(1, Math.min(colW * 0.55, 7));

    var s = ['<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
             '" role="img" aria-label="' + title + ' by day">'];

    // gridline at the peak
    s.push('<line x1="0" y1="' + PAD_TOP + '" x2="' + W + '" y2="' + PAD_TOP +
           '" stroke="var(--rule)" stroke-dasharray="2 4"/>');
    s.push('<text x="4" y="' + (PAD_TOP - 4) + '" font-size="9" fill="var(--soft)" ' +
           'font-family="IBM Plex Mono, monospace">' + max + '</text>');

    // month ticks
    days.forEach(function (d, i) {
      if (d.date.slice(8) !== "01") return;
      var x = colW * (i + 0.5);
      s.push('<line x1="' + x + '" y1="' + base + '" x2="' + x + '" y2="' + (base + 4) +
             '" stroke="var(--rule)"/>');
      s.push('<text x="' + (x + 3) + '" y="' + (base + 15) + '" font-size="9" ' +
             'fill="var(--soft)" font-family="IBM Plex Mono, monospace">' +
             label(d.date).split(" ")[1] + '</text>');
    });

    // pen strokes
    days.forEach(function (d, i) {
      var v = d[key];
      if (!v) return;
      var x = colW * (i + 0.5);
      var y = base - v * scale;
      s.push('<line x1="' + x + '" y1="' + base + '" x2="' + x + '" y2="' + y +
             '" stroke="var(--pen)" stroke-width="' + barW + '"/>');
      if (subKey && d[subKey]) {
        var yu = base - d[subKey] * scale;
        s.push('<line x1="' + (x - barW) + '" y1="' + yu + '" x2="' + (x + barW) +
               '" y2="' + yu + '" stroke="var(--pen-2)" stroke-width="1.5"/>');
      }
    });

    s.push('<line x1="0" y1="' + base + '" x2="' + W + '" y2="' + base +
           '" stroke="var(--ink)" stroke-width="1"/>');

    // cursor + pen head, parked at the last day
    s.push('<g class="cursor-line"><line x1="0" y1="0" x2="0" y2="' + base +
           '" stroke="var(--ink)" stroke-width="1" opacity="0"/></g>');
    s.push('<g class="pen"><circle cx="0" cy="' + base + '" r="3.5" fill="var(--pen)"/></g>');
    s.push('</svg>');

    box.innerHTML = s.join("");
    box.tabIndex = 0;
    box.setAttribute("role", "application");
    box.setAttribute("aria-label", title + ", arrow keys to read individual days");

    var chart = {
      key: key,
      colW: colW,
      base: base,
      scale: scale,
      cursor: box.querySelector(".cursor-line"),
      pen: box.querySelector(".pen"),
      cursorLine: box.querySelector(".cursor-line line")
    };
    state.charts.push(chart);

    box.addEventListener("mousemove", function (e) {
      var r = box.getBoundingClientRect();
      var i = Math.floor((e.clientX - r.left) / (r.width / days.length));
      setCursor(Math.max(0, Math.min(days.length - 1, i)));
    });
    box.addEventListener("mouseleave", function () { setCursor(null); });
    box.addEventListener("keydown", function (e) {
      var i = state.cursor === null ? days.length - 1 : state.cursor;
      if (e.key === "ArrowRight") { setCursor(Math.min(days.length - 1, i + 1)); e.preventDefault(); }
      if (e.key === "ArrowLeft") { setCursor(Math.max(0, i - 1)); e.preventDefault(); }
      if (e.key === "Escape") setCursor(null);
    });
  }

  // ---- shared cursor ------------------------------------------------------
  function setCursor(i) {
    state.cursor = i;
    var days = windowed();
    var day = i === null ? null : days[i];
    var at = i === null ? days.length - 1 : i;

    state.charts.forEach(function (c) {
      var x = c.colW * (at + 0.5);
      var v = days[at][c.key] || 0;
      c.cursor.setAttribute("transform", "translate(" + x + ",0)");
      c.cursorLine.setAttribute("opacity", i === null ? 0 : 0.35);
      c.pen.setAttribute("transform",
        "translate(" + x + "," + (-v * c.scale) + ")");
    });

    var totals = days.reduce(function (a, d) {
      a.views += d.views; a.uniques += d.uniques; a.clones += d.clones;
      a.downloads += (d.downloads || 0);
      return a;
    }, { views: 0, uniques: 0, clones: 0, downloads: 0 });

    var src = day || totals;
    document.getElementById("lab-a").textContent = day ? label(day.date) : "Views";
    document.getElementById("lab-b").textContent = day ? "Unique" : "Unique";
    document.getElementById("val-a").textContent = fmt(src.views);
    document.getElementById("val-b").textContent = fmt(src.uniques);
    document.getElementById("val-c").textContent = fmt(src.clones);
    document.getElementById("val-d").textContent =
      day ? fmt(day.downloads) : fmt(totals.downloads);

    ["a", "b", "c", "d"].forEach(function (k) {
      document.getElementById("val-" + k).classList.toggle("muted", !!day);
    });
  }
})();
</script>
</body>
</html>
