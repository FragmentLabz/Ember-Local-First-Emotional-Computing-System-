# Runs the checks a contributor would run locally: the frontend build, the
# Python service's tests, and the C# validation engine's tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Electron's binary is a large download and is not needed to build.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx vite build

  reflective-modules:
    name: Python service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/reflective-modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/reflective-modules/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  validation-engine:
    name: C# engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test services/validation-engine-tests --verbosity minimal
